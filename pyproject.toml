[project]
name="llm-eval-observability"
version="0.1.0"
requires-python=">=3.11"
dependencies=["fastapi>=0.115,<1","pydantic>=2.9,<3","uvicorn>=0.30,<1"]
[project.optional-dependencies]
dev=["pytest>=8,<9","ruff>=0.8,<1"]
[build-system]
requires=["hatchling"]
build-backend="hatchling.build"
[tool.hatch.build.targets.wheel]
packages=["app"]
[tool.pytest.ini_options]
testpaths=["tests"]
